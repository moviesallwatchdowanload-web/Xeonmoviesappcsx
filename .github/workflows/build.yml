name: XeonMovies CloudStream Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v6.0.2

      - name: Setup JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create local.properties
        env:
          SIMKL_API: ${{ secrets.SIMKL_API }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          CASTLE_KEY: ${{ secrets.CASTLE_KEY }}
          MOVIEBLAST_TOKEN: ${{ secrets.MOVIEBLAST_TOKEN }}
          MOVIEBLAST_API: ${{ secrets.MOVIEBLAST_API }}
          MOVIEBLAST_KEY: ${{ secrets.MOVIEBLAST_KEY }}
        run: |
          touch local.properties
          echo "SIMKL_API=$SIMKL_API" >> local.properties
          echo "TMDB_KEY=$TMDB_KEY" >> local.properties
          echo "CASTLE_KEY=$CASTLE_KEY" >> local.properties
          echo "MOVIEBLAST_TOKEN=$MOVIEBLAST_TOKEN" >> local.properties
          echo "MOVIEBLAST_API=$MOVIEBLAST_API" >> local.properties
          echo "MOVIEBLAST_KEY=$MOVIEBLAST_KEY" >> local.properties

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build CloudStream Plugins
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./gradlew make makePluginsJson --stacktrace --no-daemon

      - name: Create repo.json
        run: |
          cat > repo.json <<'EOF'
          {
            "name": "XeonMovies",
            "description": "XeonMovies CloudStream Extensions",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/moviesallwatchdowanload-web/Xeonmoviesappcsx/builds/plugins.json"
            ]
          }
          EOF

      - name: Find Generated Files
        run: |
          echo "===== CS3 FILES ====="
          find . -type f -name "*.cs3" -print

          echo "===== PLUGINS JSON ====="
          find . -type f -name "plugins.json" -print

          echo "===== REPO JSON ====="
          cat repo.json

      - name: Prepare Builds Branch
        run: |
          mkdir -p /tmp/builds-repo

          git fetch origin builds || true

          if git ls-remote --exit-code --heads origin builds >/dev/null 2>&1; then
            git worktree add /tmp/builds-repo origin/builds
          else
            git worktree add --detach /tmp/builds-repo
            cd /tmp/builds-repo
            git checkout --orphan builds
            git rm -rf . 2>/dev/null || true
          fi

      - name: Publish CloudStream Repository
        run: |
          rm -rf /tmp/builds-repo/*
          rm -rf /tmp/builds-repo/.[!.]* /tmp/builds-repo/..?* 2>/dev/null || true

          find . -type f -name "*.cs3" -exec cp {} /tmp/builds-repo/ \;

          PLUGINS_JSON=$(find . -type f -name "plugins.json" | head -n 1)

          if [ -z "$PLUGINS_JSON" ]; then
            echo "ERROR: plugins.json was not generated"
            exit 1
          fi

          cp "$PLUGINS_JSON" /tmp/builds-repo/plugins.json
          cp repo.json /tmp/builds-repo/repo.json

          cd /tmp/builds-repo

          echo "===== BUILDS BRANCH ====="
          ls -lah

          echo "===== plugins.json ====="
          cat plugins.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Build CloudStream plugins" || echo "Nothing to commit"
          git push origin HEAD:builds --force
