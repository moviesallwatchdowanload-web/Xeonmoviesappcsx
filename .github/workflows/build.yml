name: XeonMovies APK Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v6.0.2

      - name: Setup JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          adb version || true
          ls -la "$ANDROID_HOME" || true

      - name: Create local.properties
        env:
          SIMKL_API: ${{ secrets.SIMKL_API }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          CASTLE_KEY: ${{ secrets.CASTLE_KEY }}
          MOVIEBLAST_TOKEN: ${{ secrets.MOVIEBLAST_TOKEN }}
          MOVIEBLAST_API: ${{ secrets.MOVIEBLAST_API }}
          MOVIEBLAST_KEY: ${{ secrets.MOVIEBLAST_KEY }}
        run: |
          touch local.properties

          echo "SIMKL_API=$SIMKL_API" >> local.properties
          echo "TMDB_KEY=$TMDB_KEY" >> local.properties
          echo "CASTLE_KEY=$CASTLE_KEY" >> local.properties
          echo "MOVIEBLAST_TOKEN=$MOVIEBLAST_TOKEN" >> local.properties
          echo "MOVIEBLAST_API=$MOVIEBLAST_API" >> local.properties
          echo "MOVIEBLAST_KEY=$MOVIEBLAST_KEY" >> local.properties

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Show Gradle Tasks
        run: ./gradlew tasks --all

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XeonMovies-APK
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/apk/*.apk
          if-no-files-found: error
