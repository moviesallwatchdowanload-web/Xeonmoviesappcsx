      - name: Publish Builds Branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          rm -rf /tmp/builds-repo
          mkdir -p /tmp/builds-repo

          # Copy generated files BEFORE initializing Git
          find . -type f -name "*.cs3" -exec cp {} /tmp/builds-repo/ \;

          PLUGINS_JSON=$(find . -type f -name "plugins.json" | head -n 1)

          if [ -z "$PLUGINS_JSON" ]; then
            echo "ERROR: plugins.json was not generated"
            exit 1
          fi

          cp "$PLUGINS_JSON" /tmp/builds-repo/plugins.json
          cp repo.json /tmp/builds-repo/repo.json

          cd /tmp/builds-repo

          echo "===== FILES TO PUBLISH ====="
          ls -lah

          echo "===== plugins.json ====="
          cat plugins.json

          # Initialize a completely fresh Git repository
          git init
          git checkout --orphan builds

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Build CloudStream plugins"

          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          git push origin HEAD:builds --force

